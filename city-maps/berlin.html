<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berlin – Bezirke & Verkehr</title>
    <meta
      name="description"
      content="Interaktive Karte der Berliner Bezirke mit öffentlichen Verkehrsverbindungen"
    />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="../shared/css/base.css" />
    <link rel="stylesheet" href="../shared/css/components.css" />
    <link rel="stylesheet" href="../shared/css/map-common.css" />
    <link rel="stylesheet" href="css/city-maps.css" />
  </head>

  <body>
    <!-- Main container -->
    <main class="map-container">
      <!-- Map Container -->
      <section class="map-section">
        <div class="custom-popup" id="map">
          <button class="transport-toggle" id="transportToggle">
            Öffentliche Verkehrsmittel
          </button>
        </div>
      </section>
    </main>

    <!-- Loading indicator -->
    <div id="loading-indicator" class="loading-overlay" style="display: none">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Lade Kartendaten...</p>
      </div>
    </div>

    <!-- Scripts -->
    <!-- Leaflet JavaScript -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Platform scripts -->
    <script src="../shared/js/env-loader.js"></script>
    <script src="../shared/js/map-utils.js"></script>
    <script src="../shared/js/map-base.js"></script>
    <script src="js/map-core.js"></script>

    <!-- Berlin city configuration -->
    <script src="config/berlin-city-config.js"></script>

    <!-- Page setup -->
    <script>
      (function () {
        "use strict";

        let berlinCityMap;

        function showLoading(message = BerlinCityConfig.ui.loadingText) {
          const el = document.getElementById("loading-indicator");
          if (!el) return;
          el.querySelector(".loading-text").textContent = message;
          el.style.display = "flex";
        }

        function hideLoading() {
          const el = document.getElementById("loading-indicator");
          if (el) el.style.display = "none";
        }

        async function init() {
          try {
            showLoading("Lade Konfiguration...");
            await BerlinCityConfig.setupGoogleSheets();

            berlinCityMap = new InteractiveMap(BerlinCityConfig);
            await berlinCityMap.initializeWithData(showLoading, hideLoading);

            window.berlinCityMap = berlinCityMap;
          } catch (error) {
            hideLoading();
            MapUtils.handleError(error, "beim Initialisieren der Karte");
          }
        }

        // Allow an embedding page (e.g. WordPress) to recenter the map.
        window.changeMapView = function (coordinates, zoom) {
          if (berlinCityMap) berlinCityMap.getMap().setView(coordinates, zoom);
        };

        document.addEventListener("DOMContentLoaded", init);
      })();
    </script>
  </body>
</html>
