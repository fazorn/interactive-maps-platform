# Netlify configuration for the interactive maps platform.
# Static site (no build step) with clean URLs for each map.

[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'No build step required - static files'"

# Clean URLs.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# City maps. Add one line per new city.
[[redirects]]
  from = "/city-maps/berlin"
  to = "/city-maps/berlin.html"
  status = 200

# Media maps (Berlin only for now).
[[redirects]]
  from = "/media-maps/berlin"
  to = "/media-maps/berlin.html"
  status = 200

# Security and performance headers.
[[headers]]
  for = "/*"
  [headers.values]
    # Allow the maps to be embedded on the WTM sites.
    Content-Security-Policy = "frame-ancestors 'self' https://wtm-aussenwerbung.de https://wtm-aussenwerbung-berlin.de;"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "on"

[[headers]]
  for = "/shared/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/shared/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/shared/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[build.environment]
  NODE_VERSION = "18"

# Asset optimization.
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
